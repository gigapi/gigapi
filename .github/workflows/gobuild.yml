name: Build & Test

on:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24'
        cache: true

    - name: Build
      run: |
        go mod tidy
        CGO_ENABLED=1 go build -o gigapi .

    - name: Run tests
      continue-on-error: true
      run: |
        mkdir -p ./data
        go test -v ./...
      env:
        GIGAPI_ROOT: ./data
        GIGAPI_ENABLED: true
        GIGAPI_MERGE_TIMEOUT_S: 10
#        GIGAPI_METADATA_TYPE: redis
#        GIGAPI_METADATA_URL: redis://localhost:6379/0 
